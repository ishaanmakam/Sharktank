  <h2 class="t">What is Halcyon?</h2>
  <div class="txt" style="position:absolute;left:120px;top:250px;width:900px">
    <p>Halcyon is a <b>50-seat regional plane</b> that runs on liquid hydrogen. It uses fuel cells and electric motors instead of jet engines, and a lot of its shape is copied from animals.</p>
    <p>Our first route would be <b>Seattle to Spokane</b>.</p>
  </div>
  <div class="pic" style="left:1100px;top:240px;width:700px;height:520px"><img src="assets/img/kingfisher.jpg" alt="Common kingfisher"></div>
  <p class="small" style="position:absolute;left:1100px;top:780px;width:700px;text-align:center;font-size:26px">"Halcyon" is an old name for the kingfisher</p>
